<div class="bot-container">
  <!-- Botó per obrir/tancar -->
  <button class="chat-toggle" (click)="toggleChat()">
    <img src="assets/ui/account-user-avatar.svg" alt="BobbyBot" *ngIf="!isOpen()">
    <span *ngIf="isOpen()">✕</span>
  </button>

  <!-- Finestra del xat -->
  <div class="chat-window" [class.open]="isOpen()">
    <div class="chat-header">
      <h6>BobbyBot - Assistent Gamestorm</h6>
    </div>

    <div class="messages-container">
      <div *ngFor="let msg of messages()" class="message" [ngClass]="msg.sender">
        <div class="bubble">
          {{ msg.text }}
        </div>
      </div>
      <div *ngIf="isLoading()" class="message bot">
        <div class="bubble typing">...</div>
      </div>
    </div>

    <div class="chat-input">
      <input 
        type="text" 
        [(ngModel)]="userInput" 
        (keyup.enter)="sendMessage()" 
        placeholder="Escriu aquí..."
        [disabled]="isLoading()"
      >
      <button (click)="sendMessage()" [disabled]="isLoading() || !userInput.trim()">
        ➤
      </button>
    </div>
  </div>
</div>
